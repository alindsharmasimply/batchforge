[project]
name = "batchforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alindsharmasimply", email = "alindsharmasimply@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
batchforge = "batchforge:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
